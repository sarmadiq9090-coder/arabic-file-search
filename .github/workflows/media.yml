name: media

# Records the README demo GIFs and screenshots on a real Windows machine (so
# Arabic text renders correctly) and measures search speed against the
# built-in Windows tools. Run it by hand (Actions → media → Run workflow), or
# it runs when its own scripts change on a claude/* branch. The results are
# committed to docs/media/ on the branch that ran it.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["ci/demo.ps1", "ci/bench.ps1", "ci/make-media.sh", ".github/workflows/media.yml"]

permissions:
  contents: read

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build bahth.exe
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/bahth.exe bahth.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bahth-exe
          path: bahth.exe

  record:
    needs: exe
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bahth-exe
      - name: Demo recordings
        shell: powershell
        run: ./ci/demo.ps1 -Exe ./bahth.exe -Out ./media-raw
      - name: Speed comparison
        shell: powershell
        run: ./ci/bench.ps1 -Exe ./bahth.exe -Out ./media-raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-raw
          path: media-raw

  assemble:
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: media-raw
          path: media-raw
      - name: Make GIFs
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          bash ci/make-media.sh media-raw docs/media
      - name: Commit to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Update demo GIFs, screenshots and speed comparison"
          git push origin "HEAD:${GITHUB_REF_NAME}"
