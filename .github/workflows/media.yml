name: media

# Records the README demo GIFs and screenshots on a real Windows machine (so
# Arabic text renders correctly) and measures search speed against the
# built-in Windows tools. Run it by hand (Actions → media → Run workflow), or
# it runs when its own scripts change on a claude/* branch. The results are
# committed to docs/media/ on the branch that ran it.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["ci/demo.ps1", "ci/bench.ps1", "ci/make-media.sh", ".github/workflows/media.yml"]

permissions:
  contents: read

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build bahth.exe
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/bahth.exe bahth.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bahth-exe
          path: bahth.exe

  record:
    needs: exe
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bahth-exe
      - name: Demo recordings
        shell: powershell
        run: ./ci/demo.ps1 -Exe ./bahth.exe -Out ./media-raw
      - name: Speed comparison
        shell: powershell
        run: ./ci/bench.ps1 -Exe ./bahth.exe -Out ./media-raw
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: media-raw
          path: media-raw

  assemble:
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: media-raw
          path: media-raw
      - name: Make GIFs
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          bash ci/make-media.sh media-raw docs/media
      - name: Commit to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media site/img
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Update demo GIFs, screenshots and speed comparison"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
