name: build

# CI checks and builds every push. Three exes are built, each smoke-tested on
# real Windows, and when main gets a version (Cargo.toml) that has no tag yet,
# the `release` job tags it and publishes those same exes:
#   bahth.exe        x64, cross-built with mingw (x86_64-pc-windows-gnu). This
#                    name must never change: every installed copy's updater
#                    looks for it.
#   bahth-x86.exe    32-bit, cross-built with mingw (i686-pc-windows-gnu).
#   bahth-arm64.exe  ARM64, built natively on a Windows ARM runner
#                    (aarch64-pc-windows-msvc, static CRT).
# The updater in each build fetches the asset for its own CPU (src/update.rs).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Quick feedback: the search, index, extraction and parsing logic is
  # platform-independent and tested on Linux in about a minute.
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # Debug tests above catch integer overflow; release tests catch what
      # only shows up optimised (and are what users run).
      - name: Test (release)
        run: cargo test --release

  # Lints on Windows. Kept out of the release job so a lint added by a newer
  # Rust can never block publishing a release.
  windows-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  windows:
    needs: linux-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release

  # The x64 and x86 exes exactly as they are published: cross-built on Linux
  # with mingw.
  exe:
    needs: linux-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, i686-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build bahth.exe and bahth-x86.exe
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
          cargo build --release --target x86_64-pc-windows-gnu
          cargo build --release --target i686-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/bahth.exe bahth.exe
          cp target/i686-pc-windows-gnu/release/bahth.exe bahth-x86.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bahth-exe
          path: bahth.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bahth-x86-exe
          path: bahth-x86.exe

  # The ARM64 exe, built and unit-tested natively on Windows on ARM.
  exe-arm64:
    needs: linux-test
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --target aarch64-pc-windows-msvc
      - name: Build bahth-arm64.exe
        shell: pwsh
        run: |
          cargo build --release --target aarch64-pc-windows-msvc
          Copy-Item target/aarch64-pc-windows-msvc/release/bahth.exe bahth-arm64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bahth-arm64-exe
          path: bahth-arm64.exe

  # Runs each exe on a real Windows machine of its CPU (x86 under WOW64): the
  # GUI indexes the drive, then the command line searches the index. Any
  # crash report fails it.
  smoke:
    needs: [exe, exe-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { machine: x64, os: windows-latest, artifact: bahth-exe, file: bahth.exe }
          - { machine: x86, os: windows-latest, artifact: bahth-x86-exe, file: bahth-x86.exe }
          - { machine: arm64, os: windows-11-arm, artifact: bahth-arm64-exe, file: bahth-arm64.exe }
    name: smoke (${{ matrix.machine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
      - name: Smoke test
        shell: pwsh
        run: ./ci/smoke.ps1 -Exe ./${{ matrix.file }} -Machine ${{ matrix.machine }}

  release:
    needs: [linux-test, windows, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # Publishes the very exes the smoke tests ran.
      - if: steps.v.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: bahth-*exe
          merge-multiple: true
      - if: steps.v.outputs.new == 'true'
        name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          for f in bahth.exe bahth-x86.exe bahth-arm64.exe; do test -s "$f"; done
          notes="releases/$TAG-notes.md"
          [ -f "$notes" ] || notes=/dev/null
          title=$(head -1 "$notes" | sed 's/^# *//')
          [ -n "$title" ] || title="$TAG"
          gh release create "$TAG" bahth.exe bahth-x86.exe bahth-arm64.exe --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --latest
      # Package managers: packaging.yml rewrites the Scoop, winget and
      # Chocolatey manifests and commits them to main (and pushes to
      # Chocolatey/winget when their secrets exist). A release made with
      # GITHUB_TOKEN does not fire its `release` event, so start it here.
      - if: steps.v.outputs.new == 'true'
        name: Update package manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh workflow run packaging.yml --ref main -f tag="$TAG"
