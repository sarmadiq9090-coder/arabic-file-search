name: build

# CI checks and builds every push. When main gets a version (Cargo.toml) that
# has no tag yet, the `release` job tags it and publishes the GitHub Release
# with the exe cross-built exactly as in local QC (x86_64-pc-windows-gnu),
# under the asset name `bahth.exe` that the in-app updater downloads.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Quick feedback: the search, index, extraction and parsing logic is
  # platform-independent and tested on Linux in about a minute.
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # Lints on Windows. Kept out of the release job so a lint added by a newer
  # Rust can never block publishing a release.
  windows-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  windows:
    needs: linux-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: bahth-windows
          path: target/release/bahth.exe

  release:
    needs: [linux-test, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.new == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - if: steps.v.outputs.new == 'true'
        name: Build bahth.exe
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/bahth.exe bahth.exe
      - if: steps.v.outputs.new == 'true'
        name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          notes="releases/$TAG-notes.md"
          [ -f "$notes" ] || notes=/dev/null
          title=$(head -1 "$notes" | sed 's/^# *//')
          [ -n "$title" ] || title="$TAG"
          gh release create "$TAG" bahth.exe --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --latest
