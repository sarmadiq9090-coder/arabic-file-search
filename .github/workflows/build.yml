name: build

# CI checks and builds every push. The exe is cross-built once (exactly as in
# local QC, x86_64-pc-windows-gnu), smoke-tested on real Windows, and when main
# gets a version (Cargo.toml) that has no tag yet, the `release` job tags it and
# publishes that same exe as the asset `bahth.exe` the in-app updater downloads.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Quick feedback: the search, index, extraction and parsing logic is
  # platform-independent and tested on Linux in about a minute.
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # Debug tests above catch integer overflow; release tests catch what
      # only shows up optimised (and are what users run).
      - name: Test (release)
        run: cargo test --release

  # Lints on Windows. Kept out of the release job so a lint added by a newer
  # Rust can never block publishing a release.
  windows-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  windows:
    needs: linux-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release

  # The exe exactly as it is published: cross-built on Linux with mingw.
  exe:
    needs: linux-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build bahth.exe
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/bahth.exe bahth.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bahth-exe
          path: bahth.exe

  # Runs that same exe on a real Windows machine: the GUI indexes the drive,
  # then the command line searches the index. Any crash report fails it.
  smoke:
    needs: exe
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bahth-exe
      - name: Smoke test
        shell: pwsh
        run: ./ci/smoke.ps1 -Exe ./bahth.exe

  release:
    needs: [linux-test, windows, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # Publishes the very exe the smoke test ran.
      - if: steps.v.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          name: bahth-exe
      - if: steps.v.outputs.new == 'true'
        name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          test -s bahth.exe
          notes="releases/$TAG-notes.md"
          [ -f "$notes" ] || notes=/dev/null
          title=$(head -1 "$notes" | sed 's/^# *//')
          [ -n "$title" ] || title="$TAG"
          gh release create "$TAG" bahth.exe --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --latest
      # Package managers: rewrite the Scoop, winget and Chocolatey manifests
      # for this release and commit them to main (see packaging/SUBMITTING.md).
      - if: steps.v.outputs.new == 'true'
        name: Update package manifests
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          sha=$(sha256sum bahth.exe | cut -d' ' -f1)
          git fetch -q origin main
          git checkout -q -B packaging origin/main
          python3 packaging/update-manifests.py "$TAG" "$sha" "$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bucket packaging
          git diff --cached --quiet && exit 0
          git commit -q -m "Packaging: update manifests for $TAG"
          for i in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          exit 1
