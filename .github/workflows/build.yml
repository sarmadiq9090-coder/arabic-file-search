name: build

# CI checks and builds every push. Three exes are built, each smoke-tested on
# real Windows, and when main gets a version (Cargo.toml) that has no tag yet,
# the `release` job tags it and publishes those same exes:
#   bahth.exe        x64 (x86_64-pc-windows-msvc). This name must never
#                    change: every installed copy's updater looks for it.
#   bahth-x86.exe    32-bit (i686-pc-windows-msvc).
#   bahth-arm64.exe  ARM64, built natively on a Windows ARM runner
#                    (aarch64-pc-windows-msvc).
# All three are built with MSVC and a static C runtime (.cargo/config.toml),
# so they need no Visual C++ Redistributable; ci/check_imports.py fails the
# build if an exe imports a C runtime DLL or any DLL that is not part of
# Windows. The updater in each build fetches the asset for its own CPU
# (src/update.rs).
# Releasing is version -> sign -> release: `sign` (Environment `release`,
# owner approval once its reviewers are set) adds a minisign signature
# `<exe>.minisig` for each exe once the signing secret exists, and passes
# without signing until then (docs/specs/signing.md).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Quick feedback: the search, index, extraction and parsing logic is
  # platform-independent and tested on Linux in about a minute.
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # Test-only job: nothing it builds is published, so a poisoned cache
      # could not reach users (the exe jobs below build without a cache).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # Debug tests above catch integer overflow; release tests catch what
      # only shows up optimised (and are what users run).
      - name: Test (release)
        run: cargo test --release

  # Lints on Windows. Kept out of the release job so a lint added by a newer
  # Rust can never block publishing a release.
  windows-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # Test-only job: nothing it builds is published, so a poisoned cache
      # could not reach users (the exe jobs below build without a cache).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Dependencies of the Windows exes (deny.toml): RustSec advisories,
  # licences (Apache/MIT/BSD/ISC/Zlib/Unicode plus named exceptions), banned
  # crates and where crates come from.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ""

  # Static analysis of these workflows (zizmor): template injection,
  # credential leaks, cache poisoning, unpinned actions… (.github/zizmor.yml).
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          version: "1.32.0"
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml

  windows:
    needs: linux-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc
      # Test-only job: nothing it builds is published, so a poisoned cache
      # could not reach users (the exe jobs below build without a cache).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
      - name: Test
        run: cargo test --release
      # 32-bit (usize, the x86 updater asset) under WOW64.
      - name: Test (32-bit)
        run: cargo test --release --target i686-pc-windows-msvc

  # The x64 and x86 exes exactly as they are published: MSVC with a static
  # C runtime (.cargo/config.toml), on Windows.
  exe:
    needs: linux-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
      # No build cache: these are the exes that get published (a cache
      # restored from another run could poison them).
      - name: Build bahth.exe and bahth-x86.exe
        shell: bash
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/bahth.exe bahth.exe
          cp target/i686-pc-windows-msvc/release/bahth.exe bahth-x86.exe
      # The runners have the Visual C++ runtime installed, so the smoke test
      # would not notice an exe that needs it: check the import tables.
      - name: Check the imported DLLs
        run: python ci/check_imports.py bahth.exe bahth-x86.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bahth-exe
          path: bahth.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bahth-x86-exe
          path: bahth-x86.exe

  # The ARM64 exe, built and unit-tested natively on Windows on ARM.
  exe-arm64:
    needs: linux-test
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      # No build cache: these are the exes that get published (a cache
      # restored from another run could poison them).
      - name: Test
        run: cargo test --release --target aarch64-pc-windows-msvc
      - name: Build bahth-arm64.exe
        shell: pwsh
        run: |
          cargo build --release --target aarch64-pc-windows-msvc
          Copy-Item target/aarch64-pc-windows-msvc/release/bahth.exe bahth-arm64.exe
      - name: Check the imported DLLs
        run: python ci/check_imports.py bahth-arm64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bahth-arm64-exe
          path: bahth-arm64.exe

  # Runs each exe on a real Windows machine of its CPU (x86 under WOW64): the
  # GUI indexes the drive, then the command line searches the index. Any
  # crash report fails it.
  smoke:
    needs: [exe, exe-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { machine: x64, os: windows-latest, artifact: bahth-exe, file: bahth.exe }
          - { machine: x86, os: windows-latest, artifact: bahth-x86-exe, file: bahth-x86.exe }
          - { machine: arm64, os: windows-11-arm, artifact: bahth-arm64-exe, file: bahth-arm64.exe }
    name: smoke (${{ matrix.machine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
      - name: Smoke test
        shell: pwsh
        run: ./ci/smoke.ps1 -Exe ./${{ matrix.file }} -Machine ${{ matrix.machine }}

  # A "real user" on a real Windows desktop (ci/ui-test.ps1): types Arabic and
  # English searches, opens the menus, the quick search popup and the
  # Arabic interface, closes to the tray, and screenshots every step. Core
  # checks fail the job; "probe" checks (typos, Arabizi, Arabic app names...)
  # only report what is missing. `release` waits for it: nothing is
  # published unless the real-user test passes on the same commit.
  ui:
    needs: exe
    runs-on: windows-latest
    # The first index can take 40 minutes when the runner's disk is throttled.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bahth-exe
      - name: Real-user UI test
        shell: powershell
        run: ./ci/ui-test.ps1 -Exe ./bahth.exe -Out "$env:RUNNER_TEMP/ui-test"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test
          path: ${{ runner.temp }}/ui-test

  # The new look (WebView2 main window) on a real Windows desktop
  # (ci/newlook-test.ps1): a new user gets it (the default), its page opens
  # and loads (no WebView2 failure, no blank-page fallback) and is painted;
  # classic users are moved to it once and get no way back; BAHTH_CLASSIC=1
  # gives the classic window with "Try the new look"; a WebView2 that fails
  # (BAHTH_WEBUI_FAIL=1) gives the classic window for that run only.
  # `release` waits for it.
  newlook:
    needs: exe
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bahth-exe
      - name: New-look test
        shell: powershell
        run: ./ci/newlook-test.ps1 -Exe ./bahth.exe -Out "$env:RUNNER_TEMP/newlook-test"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: newlook-test
          path: ${{ runner.temp }}/newlook-test

  # Releasing is version -> sign -> release, and starts only when every
  # check above passed on this commit and main has a Cargo.toml version with
  # no tag yet.
  #
  # Two pushes to main on release day can both find the version untagged.
  # Each of the three jobs has its own concurrency group, so two runs never
  # do the same step at once and nothing in progress is cancelled. (One group
  # shared by the three jobs would not do: a run's `version` arriving while
  # another run's `release` is pending would cancel that `release`.) The
  # `release` job checks again that the tag is free, touches only the draft
  # of its own commit, and publishes it only once its target and every asset
  # are this run's.
  version:
    needs: [linux-test, windows, smoke, ui, newlook]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}-version
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version
        id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # Signs the three exes with the owner's minisign key (docs/specs/signing.md).
  # The `release` Environment holds the secret key; once the owner has turned
  # on "Required reviewers" there, every release waits here for their
  # "Review deployments" -> Approve. This job runs no repository code: no
  # checkout, only the exes the smoke tests ran, a pinned and
  # checksum-verified minisign, and the public keys committed in keys/.
  #   no MINISIGN_SECRET_KEY, no keys/*.pub  warns, signs nothing, passes: the
  #                                          release is published unsigned and
  #                                          apps check its SHA-256, as before.
  #   MINISIGN_SECRET_KEY, no keys/*.pub     signs (checked against the key's own
  #                                          public half) and warns that apps
  #                                          do not check signatures yet.
  #   MINISIGN_SECRET_KEY and keys/*.pub     signs and checks against keys/*.pub.
  #   keys/*.pub, no MINISIGN_SECRET_KEY     fails: apps built with those keys
  #                                          would refuse an unsigned update.
  sign:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-${{ github.ref }}-sign
      cancel-in-progress: false
    permissions:
      contents: read # read keys/*.pub through the API
    outputs:
      signed: ${{ steps.cfg.outputs.signed }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      EXES: bahth.exe bahth-x86.exe bahth-arm64.exe
      # minisign 0.12, verified with its author's key
      # RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3.
      # keys/ceremony.sh pins the same file.
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      - name: Fetch the committed public keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub"
          for k in primary backup; do
            if ! gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/keys/minisign-${k}.pub?ref=${GITHUB_SHA}" \
              > "$RUNNER_TEMP/pub/${k}.pub" 2> "$RUNNER_TEMP/gh.err"; then
              rm -f "$RUNNER_TEMP/pub/${k}.pub"
              # Only "not committed" (404) means "no key". Any other API error
              # must not quietly turn into an unsigned release.
              if ! grep -q 'HTTP 404' "$RUNNER_TEMP/gh.err"; then
                cat "$RUNNER_TEMP/gh.err"
                echo "::error::Could not read keys/minisign-${k}.pub through the API"
                exit 1
              fi
            fi
          done

      - name: Is signing set up?
        id: cfg
        env:
          HAS_SECRET: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: |
          if ls "$RUNNER_TEMP"/pub/*.pub >/dev/null 2>&1; then have_pub=true; else have_pub=false; fi
          echo "have_pub=$have_pub" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SECRET" = true ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ "$have_pub" = false ]; then
              echo "::warning::$TAG is signed, but keys/minisign-primary.pub and keys/minisign-backup.pub are not committed yet, so installed copies still check the SHA-256 only. Send the public keys (block D of keys/ceremony.sh) to finish the setup: keys/README.md"
            fi
          elif [ "$have_pub" = true ]; then
            echo "::error::keys/*.pub are committed, but the release Environment has no MINISIGN_SECRET_KEY secret (or this job may not read it). Installed copies would refuse an unsigned update. See docs/specs/signing.md"
            exit 1
          else
            echo "::warning::Release signing is not set up (no MINISIGN_SECRET_KEY in the release Environment), so $TAG is published without .minisig files and installed copies check its SHA-256 only, as before. See docs/specs/signing.md"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bahth-*exe
          merge-multiple: true
          path: dist

      - if: steps.cfg.outputs.signed == 'true'
        name: Install minisign (pinned, checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o minisign.tar.gz "$MINISIGN_URL"
          echo "${MINISIGN_SHA256}  minisign.tar.gz" | sha256sum -c -
          tar xzf minisign.tar.gz minisign-linux/x86_64/minisign
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"

      - if: steps.cfg.outputs.signed == 'true'
        name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          HAVE_PUB: ${{ steps.cfg.outputs.have_pub }}
        run: |
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          # Pasted on a phone, the secret may have lost its first line
          # ("untrusted comment: ...") or gained CRs and spaces: minisign
          # needs both lines, so put the comment back when it is missing.
          key_text=$(printf '%s\n' "$MINISIGN_SECRET_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d')
          case "$key_text" in
            "untrusted comment:"*) ;;
            *) key_text=$(printf 'untrusted comment: minisign encrypted secret key\n%s' "$key_text") ;;
          esac
          printf '%s\n' "$key_text" > "$key"
          # keys/ceremony.sh makes letters-and-digits passwords: spaces or a
          # line break around a pasted one are never part of it.
          pw=$(printf '%s' "$MINISIGN_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          for f in $EXES; do
            test -s "dist/$f"
            printf '%s\n' "$pw" |
              minisign -S -s "$key" -m "dist/$f" -t "instafind $TAG"
          done
          # No committed public key yet: check against the secret key's own
          # public half, so at least the signatures are known to be sound.
          if [ "$HAVE_PUB" != true ]; then
            printf '%s\n' "$pw" |
              minisign -R -s "$key" -p "$RUNNER_TEMP/pub/from-secret.pub"
          fi

      - if: steps.cfg.outputs.signed == 'true'
        name: Verify the signatures
        run: |
          expected="instafind $TAG"
          for f in $EXES; do
            ok=
            for pub in "$RUNNER_TEMP"/pub/*.pub; do
              # -H: pre-hashed only, as the app requires.
              if minisign -V -H -m "dist/$f" -p "$pub"; then
                comment=$(minisign -V -H -Q -m "dist/$f" -p "$pub")
                if [ "$comment" != "$expected" ]; then
                  echo "::error::$f: trusted comment is '$comment', expected '$expected'"
                  exit 1
                fi
                echo "$f verified with $(basename "$pub"): $comment"
                ok=1
                break
              fi
            done
            if [ -z "$ok" ]; then
              echo "::error::$f: the signature does not verify with any committed public key (wrong MINISIGN_SECRET_KEY?)"
              exit 1
            fi
          done

      - if: steps.cfg.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bahth-minisig
          path: dist/*.minisig
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, sign]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SIGNED: ${{ needs.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Another run may have published this version while this one waited
      # for its turn (or for approval): then there is nothing left to do.
      - name: Is the tag still free?
        id: free
        run: |
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || rc=$?
          case "$rc" in
            0) echo "::notice::$TAG was published by another run while this one waited, so this run publishes nothing."
               echo "free=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "free=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not read the tags of origin (git ls-remote exit $rc)"; exit 1 ;;
          esac
      # Publishes the very exes the smoke tests ran.
      - if: steps.free.outputs.free == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bahth-*exe
          merge-multiple: true
      - if: steps.free.outputs.free == 'true' && needs.sign.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bahth-minisig
      # A failed earlier run of this commit can leave a draft of this tag
      # behind: remove it so "Re-run failed jobs" just works. Only drafts of
      # this commit: a draft of another commit belongs to another run.
      - if: steps.free.outputs.free == 'true'
        name: Remove stale drafts of this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\" and .target_commitish == \"${GITHUB_SHA}\") | .id" |
            while read -r id; do
              echo "Deleting stale draft release ${id}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            done
      # A draft first, then publish once every file is there: installed
      # copies ask for `releases/latest`, which never returns a draft, so
      # nobody is offered a half-uploaded release. Assets: the three exes,
      # their .minisig files when signed, and SHA256SUMS.txt (the official
      # checksums of every other asset). The draft is then handled by its id,
      # never by its tag (gh finds a draft by tag, and another run's draft
      # may have the same one), and published only when it targets this
      # commit and each of its assets has the SHA-256 of this run's file.
      - if: steps.free.outputs.free == 'true'
        name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          exes=(bahth.exe bahth-x86.exe bahth-arm64.exe)
          sigs=()
          if [ "$SIGNED" = true ]; then sigs=("${exes[@]/%/.minisig}"); fi
          for f in "${exes[@]}" "${sigs[@]}"; do test -s "$f"; done
          sha256sum "${exes[@]}" "${sigs[@]}" > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          files=("${exes[@]}" "${sigs[@]}" SHA256SUMS.txt)
          notes="releases/$TAG-notes.md"
          [ -f "$notes" ] || notes=/dev/null
          title=$(head -1 "$notes" | sed 's/^# *//')
          [ -n "$title" ] || title="$TAG"
          gh release create "$TAG" "${files[@]}" --draft --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          fail() {
            echo "::error::$1 The draft was left unpublished; re-run the failed jobs."
            exit 1
          }
          # This run's draft: of this tag and this commit, and only one.
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\" and .target_commitish == \"${GITHUB_SHA}\") | .id")
          [ "$(printf '%s\n' "$ids" | grep -c .)" = 1 ] || fail "Expected one draft of $TAG for $GITHUB_SHA, found [${ids//$'\n'/ }]."
          id=$ids
          rel=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}")
          field() { jq -r "$1" <<<"$rel"; }
          [ "$(field .draft)" = true ] || fail "Release $id is no longer a draft."
          [ "$(field .tag_name)" = "$TAG" ] || fail "Draft $id has the tag $(field .tag_name), expected $TAG."
          [ "$(field .target_commitish)" = "$GITHUB_SHA" ] || fail "Draft $id targets $(field .target_commitish), expected $GITHUB_SHA."
          # Every expected file and nothing else...
          want=$(printf '%s\n' "${files[@]}" | LC_ALL=C sort | paste -sd ' ' -)
          got=$(field '[.assets[] | .name] | sort | join(" ")')
          [ "$got" = "$want" ] || fail "Draft $id has [$got], expected [$want]."
          # ...each one byte for byte the file this run built.
          mkdir -p "$RUNNER_TEMP/uploaded"
          while read -r aid name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" > "$RUNNER_TEMP/uploaded/$name"
            up=$(sha256sum < "$RUNNER_TEMP/uploaded/$name" | cut -d' ' -f1)
            local_sum=$(sha256sum < "$name" | cut -d' ' -f1)
            [ "$up" = "$local_sum" ] || fail "$name in draft $id has SHA-256 $up, this run's file has $local_sum."
            echo "$name: $up"
          done < <(field '.assets[] | "\(.id) \(.name)"')
          # Publishing creates the tag at the target: it must still be free.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || rc=$?
          [ "$rc" = 2 ] || fail "The tag $TAG exists now (or the tags could not be read: exit $rc)."
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F draft=false -f make_latest=true --jq '.html_url'
      # Package managers: packaging.yml rewrites the Scoop, winget and
      # Chocolatey manifests and commits them to main (and pushes to
      # Chocolatey/winget when their secrets exist). A release made with
      # GITHUB_TOKEN does not fire its `release` event, so start it here.
      - if: steps.free.outputs.free == 'true'
        name: Update package manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run packaging.yml --ref main -f tag="$TAG"
      # Microsoft Store: store.yml packs this release's exes into the
      # .msixbundle for Partner Center (artifact `store-package`; nothing is
      # uploaded to the Store). Started here for the same GITHUB_TOKEN reason.
      - if: steps.free.outputs.free == 'true'
        name: Build the Store package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run store.yml --ref main -f tag="$TAG"
