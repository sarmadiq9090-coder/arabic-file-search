name: build

# CI checks and builds every push. Three exes are built, each smoke-tested on
# real Windows, and when main gets a version (Cargo.toml) that has no tag yet,
# the `release` job tags it and publishes those same exes:
#   bahth.exe        x64, cross-built with mingw (x86_64-pc-windows-gnu). This
#                    name must never change: every installed copy's updater
#                    looks for it.
#   bahth-x86.exe    32-bit, cross-built with mingw (i686-pc-windows-gnu).
#   bahth-arm64.exe  ARM64, built natively on a Windows ARM runner
#                    (aarch64-pc-windows-msvc, static CRT).
# The updater in each build fetches the asset for its own CPU (src/update.rs).
# Releasing is version -> sign -> release: `sign` (Environment `release`,
# owner approval) adds a minisign signature `<exe>.minisig` for each exe once
# the signing secret exists, and passes without signing until then
# (docs/specs/signing.md). `manifest` writes the update manifest latest.json
# (docs/specs/update-manifest.md); `sign` signs it too when it signs the exes,
# and `release` attaches both to the release and stages them as the artifact
# `site-updates` (updates/instafind/latest.json[.minisig]), which the website
# repo's deploy picks up and serves at fastkiwi.app/updates/instafind/. This
# workflow uploads nothing anywhere else.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Quick feedback: the search, index, extraction and parsing logic is
  # platform-independent and tested on Linux in about a minute.
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # Test-only job: nothing it builds is published, so a poisoned cache
      # could not reach users (the exe jobs below build without a cache).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # Debug tests above catch integer overflow; release tests catch what
      # only shows up optimised (and are what users run).
      - name: Test (release)
        run: cargo test --release
      - name: Test the update manifest tool
        run: python3 -m unittest discover -s tools -p "test_*.py"

  # Lints on Windows. Kept out of the release job so a lint added by a newer
  # Rust can never block publishing a release.
  windows-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # Test-only job: nothing it builds is published, so a poisoned cache
      # could not reach users (the exe jobs below build without a cache).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Dependencies of the Windows exes (deny.toml): RustSec advisories,
  # licences (Apache/MIT/BSD/ISC/Zlib/Unicode plus named exceptions), banned
  # crates and where crates come from.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ""

  # Static analysis of these workflows (zizmor): template injection,
  # credential leaks, cache poisoning, unpinned actions… (.github/zizmor.yml).
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          version: "1.32.0"
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml

  windows:
    needs: linux-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc
      # Test-only job: nothing it builds is published, so a poisoned cache
      # could not reach users (the exe jobs below build without a cache).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
      - name: Test
        run: cargo test --release
      # 32-bit (usize, the x86 updater asset) under WOW64.
      - name: Test (32-bit)
        run: cargo test --release --target i686-pc-windows-msvc

  # The x64 and x86 exes exactly as they are published: cross-built on Linux
  # with mingw.
  exe:
    needs: linux-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu, i686-pc-windows-gnu
      # No build cache: these are the exes that get published (a cache
      # restored from another run could poison them).
      - name: Build bahth.exe and bahth-x86.exe
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
          cargo build --release --target x86_64-pc-windows-gnu
          cargo build --release --target i686-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/bahth.exe bahth.exe
          cp target/i686-pc-windows-gnu/release/bahth.exe bahth-x86.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bahth-exe
          path: bahth.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bahth-x86-exe
          path: bahth-x86.exe

  # The ARM64 exe, built and unit-tested natively on Windows on ARM.
  exe-arm64:
    needs: linux-test
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      # No build cache: these are the exes that get published (a cache
      # restored from another run could poison them).
      - name: Test
        run: cargo test --release --target aarch64-pc-windows-msvc
      - name: Build bahth-arm64.exe
        shell: pwsh
        run: |
          cargo build --release --target aarch64-pc-windows-msvc
          Copy-Item target/aarch64-pc-windows-msvc/release/bahth.exe bahth-arm64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bahth-arm64-exe
          path: bahth-arm64.exe

  # Runs each exe on a real Windows machine of its CPU (x86 under WOW64): the
  # GUI indexes the drive, then the command line searches the index. Any
  # crash report fails it.
  smoke:
    needs: [exe, exe-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { machine: x64, os: windows-latest, artifact: bahth-exe, file: bahth.exe }
          - { machine: x86, os: windows-latest, artifact: bahth-x86-exe, file: bahth-x86.exe }
          - { machine: arm64, os: windows-11-arm, artifact: bahth-arm64-exe, file: bahth-arm64.exe }
    name: smoke (${{ matrix.machine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
      - name: Smoke test
        shell: pwsh
        run: ./ci/smoke.ps1 -Exe ./${{ matrix.file }} -Machine ${{ matrix.machine }}

  # A "real user" on a real Windows desktop (ci/ui-test.ps1): types Arabic and
  # English searches, opens the menus, the quick search popup and the
  # Arabic interface, closes to the tray, and screenshots every step. Core
  # checks fail the job; "probe" checks (typos, Arabizi, Arabic app names...)
  # only report what is missing. `release` waits for it: nothing is
  # published unless the real-user test passes on the same commit.
  ui:
    needs: exe
    runs-on: windows-latest
    # The first index can take 40 minutes when the runner's disk is throttled.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bahth-exe
      - name: Real-user UI test
        shell: powershell
        run: ./ci/ui-test.ps1 -Exe ./bahth.exe -Out "$env:RUNNER_TEMP/ui-test"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test
          path: ${{ runner.temp }}/ui-test

  # Is there a version to publish? (main's Cargo.toml version has no tag yet.)
  # Its own job so that `sign`, which waits for the owner's approval, only
  # runs for a real release, not on every push to main.
  version:
    needs: [linux-test, windows, smoke, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version
        id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # Signs the three exes with the owner's minisign key (docs/specs/signing.md).
  # The `release` Environment holds the secret key and asks the owner to
  # approve. This job runs no repository code: no checkout, only the exes
  # the smoke tests ran, a pinned and checksum-verified minisign, and the
  # public keys committed in keys/.
  #   no MINISIGN_SECRET_KEY, no keys/*.pub  warns, signs nothing, passes: the
  #                                          release is published unsigned and
  #                                          apps check its SHA-256, as before.
  #   MINISIGN_SECRET_KEY, no keys/*.pub     signs (checked against the key's own
  #                                          public half) and warns that apps
  #                                          do not check signatures yet.
  #   MINISIGN_SECRET_KEY and keys/*.pub     signs and checks against keys/*.pub.
  #   keys/*.pub, no MINISIGN_SECRET_KEY     fails: apps built with those keys
  #                                          would refuse an unsigned update.
  # Writes latest.json, the update manifest the apps ask fastkiwi.app for
  # first (docs/specs/update-manifest.md), from the smoke-tested exes. No
  # secrets; `sign` signs it.
  manifest:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bahth-*exe
          merge-multiple: true
          path: dist
      - name: Write latest.json
        run: |
          python3 tools/make-update-manifest build --app instafind --version "$TAG" \
            --repo "$GITHUB_REPOSITORY" --notes-file "releases/$TAG-notes.md" \
            --notes-url https://fastkiwi.app/releases/ \
            --asset x64=dist/bahth.exe --asset x86=dist/bahth-x86.exe --asset arm64=dist/bahth-arm64.exe \
            --out latest.json
          python3 tools/make-update-manifest verify latest.json --app instafind --assets dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-manifest
          path: latest.json
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [version, manifest]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # read keys/*.pub through the API
    outputs:
      signed: ${{ steps.cfg.outputs.signed }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      EXES: bahth.exe bahth-x86.exe bahth-arm64.exe
      # minisign 0.12, verified with its author's key
      # RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3.
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      - name: Fetch the committed public keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub"
          for k in primary backup; do
            if ! gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/keys/minisign-${k}.pub?ref=${GITHUB_SHA}" \
              > "$RUNNER_TEMP/pub/${k}.pub" 2> "$RUNNER_TEMP/gh.err"; then
              rm -f "$RUNNER_TEMP/pub/${k}.pub"
              # Only "not committed" (404) means "no key". Any other API error
              # must not quietly turn into an unsigned release.
              if ! grep -q 'HTTP 404' "$RUNNER_TEMP/gh.err"; then
                cat "$RUNNER_TEMP/gh.err"
                echo "::error::Could not read keys/minisign-${k}.pub through the API"
                exit 1
              fi
            fi
          done

      - name: Is signing set up?
        id: cfg
        env:
          HAS_SECRET: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: |
          if ls "$RUNNER_TEMP"/pub/*.pub >/dev/null 2>&1; then have_pub=true; else have_pub=false; fi
          echo "have_pub=$have_pub" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SECRET" = true ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ "$have_pub" = false ]; then
              echo "::warning::$TAG is signed, but keys/minisign-primary.pub and keys/minisign-backup.pub are not committed yet, so installed copies still check the SHA-256 only. Send the .pub files to finish the setup: keys/README.md"
            fi
          elif [ "$have_pub" = true ]; then
            echo "::error::keys/*.pub are committed, but the release Environment has no MINISIGN_SECRET_KEY secret (or this job may not read it). Installed copies would refuse an unsigned update. See docs/specs/signing.md"
            exit 1
          else
            echo "::warning::Release signing is not set up (no MINISIGN_SECRET_KEY in the release Environment), so $TAG is published without .minisig files and installed copies check its SHA-256 only, as before. See docs/specs/signing.md"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bahth-*exe
          merge-multiple: true
          path: dist
      - if: steps.cfg.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: update-manifest
          path: dist

      # Signs only what it checked itself: the manifest is for this tag and
      # its SHA-256s are those of the exes above.
      - if: steps.cfg.outputs.signed == 'true'
        name: Check the update manifest
        run: |
          jq -e --arg tag "$TAG" '.schema == 1 and .app == "instafind" and .tag == $tag' dist/latest.json
          for pair in x64:bahth.exe x86:bahth-x86.exe arm64:bahth-arm64.exe; do
            arch=${pair%%:*}; f=${pair#*:}
            want=$(sha256sum "dist/$f" | cut -d' ' -f1)
            jq -e --arg a "$arch" --arg f "$f" --arg h "$want" \
              '.assets[$a].name == $f and .assets[$a].sha256 == $h' dist/latest.json
          done

      - if: steps.cfg.outputs.signed == 'true'
        name: Install minisign (pinned, checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o minisign.tar.gz "$MINISIGN_URL"
          echo "${MINISIGN_SHA256}  minisign.tar.gz" | sha256sum -c -
          tar xzf minisign.tar.gz minisign-linux/x86_64/minisign
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"

      - if: steps.cfg.outputs.signed == 'true'
        name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          HAVE_PUB: ${{ steps.cfg.outputs.have_pub }}
        run: |
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for f in $EXES; do
            test -s "dist/$f"
            printf '%s\n' "$MINISIGN_PASSWORD" |
              minisign -S -s "$key" -m "dist/$f" -t "instafind $TAG"
          done
          # The update manifest, with its own trusted comment.
          printf '%s\n' "$MINISIGN_PASSWORD" |
            minisign -S -s "$key" -m dist/latest.json -t "instafind update-manifest $TAG"
          # No committed public key yet: check against the secret key's own
          # public half, so at least the signatures are known to be sound.
          if [ "$HAVE_PUB" != true ]; then
            printf '%s\n' "$MINISIGN_PASSWORD" |
              minisign -R -s "$key" -p "$RUNNER_TEMP/pub/from-secret.pub"
          fi

      - if: steps.cfg.outputs.signed == 'true'
        name: Verify the signatures
        run: |
          expected="instafind $TAG"
          for f in $EXES; do
            ok=
            for pub in "$RUNNER_TEMP"/pub/*.pub; do
              # -H: pre-hashed only, as the app requires.
              if minisign -V -H -m "dist/$f" -p "$pub"; then
                comment=$(minisign -V -H -Q -m "dist/$f" -p "$pub")
                if [ "$comment" != "$expected" ]; then
                  echo "::error::$f: trusted comment is '$comment', expected '$expected'"
                  exit 1
                fi
                echo "$f verified with $(basename "$pub"): $comment"
                ok=1
                break
              fi
            done
            if [ -z "$ok" ]; then
              echo "::error::$f: the signature does not verify with any committed public key (wrong MINISIGN_SECRET_KEY?)"
              exit 1
            fi
          done
          expected="instafind update-manifest $TAG"
          for pub in "$RUNNER_TEMP"/pub/*.pub; do
            if comment=$(minisign -V -H -Q -m dist/latest.json -p "$pub"); then
              if [ "$comment" != "$expected" ]; then
                echo "::error::latest.json: trusted comment is '$comment', expected '$expected'"
                exit 1
              fi
              echo "latest.json verified with $(basename "$pub"): $comment"
              exit 0
            fi
          done
          echo "::error::latest.json: the signature does not verify with any committed public key"
          exit 1

      - if: steps.cfg.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bahth-minisig
          path: dist/*.minisig
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, manifest, sign]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SIGNED: ${{ needs.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Publishes the very exes the smoke tests ran.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bahth-*exe
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: update-manifest
      - if: needs.sign.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bahth-minisig
      # A failed earlier run can leave a draft of this tag behind: remove it so
      # "Re-run failed jobs" just works.
      - name: Remove stale drafts of this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id" |
            while read -r id; do
              echo "Deleting stale draft release ${id}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            done
      # A draft first, then publish once every file is there: installed
      # copies ask for `releases/latest`, which never returns a draft, so
      # nobody is offered a half-uploaded release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          exes=(bahth.exe bahth-x86.exe bahth-arm64.exe)
          sigs=()
          # The update manifest rides along; its signature is
          # latest.json.minisig when signed.
          if [ "$SIGNED" = true ]; then sigs=("${exes[@]/%/.minisig}" latest.json.minisig); fi
          exes+=(latest.json)
          for f in "${exes[@]}" "${sigs[@]}"; do test -s "$f"; done
          notes="releases/$TAG-notes.md"
          [ -f "$notes" ] || notes=/dev/null
          title=$(head -1 "$notes" | sed 's/^# *//')
          [ -n "$title" ] || title="$TAG"
          gh release create "$TAG" "${exes[@]}" --draft --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          if [ "${#sigs[@]}" -gt 0 ]; then gh release upload "$TAG" "${sigs[@]}"; fi
          # Every expected file, non-empty, and nothing else.
          want=$(printf '%s\n' "${exes[@]}" "${sigs[@]}" | LC_ALL=C sort | paste -sd ' ' -)
          got=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.size > 0) | .name] | sort | join(" ")')
          if [ "$got" != "$want" ]; then
            echo "::error::The draft release has [$got], expected [$want]. The draft was left unpublished; re-run the failed jobs."
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
      # The website serves the manifest (fastkiwi.app/updates/instafind/): this
      # only hands it over as an artifact, after the release is public. The
      # website repo's deploy downloads `site-updates` and publishes it.
      - name: Stage latest.json for the website
        run: python3 tools/make-update-manifest stage latest.json --out site-updates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-updates
          path: site-updates/
          if-no-files-found: error
          retention-days: 30
      # Package managers: packaging.yml rewrites the Scoop, winget and
      # Chocolatey manifests and commits them to main (and pushes to
      # Chocolatey/winget when their secrets exist). A release made with
      # GITHUB_TOKEN does not fire its `release` event, so start it here.
      - name: Update package manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run packaging.yml --ref main -f tag="$TAG"
