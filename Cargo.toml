[package]
name = "bahth"
version = "0.10.0"
edition = "2024"
description = "بحث سريع - برنامج بحث سريع عن الملفات وداخل المستندات لويندوز"
license-file = "LICENSE"
publish = false

[dependencies]
bincode = "1.3"
calamine = "0.38.0"
encoding_rs = "0.8.42"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
unicode-normalization = "0.1.26"
unicode-bidi = "0.3.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
zip = "9.1.3"
sha2 = "0.11"
# Update signatures (src/update.rs, docs/specs/signing.md): verify-only, no dependencies.
minisign-verify = "0.3.0"
cfb = "0.15.0"
regex = "1"
# The word index of the content store (src/content_words.rs); both already
# come with regex.
aho-corasick = "1.1"
memchr = "2"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
lopdf = { version = "0.42", default-features = false }
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "deflate", "ppmd"] }

[dev-dependencies]
# The encoder, only to build .7z archives in the tests.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress"] }

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["list-view", "animation-timer", "clipboard", "menu", "file-dialog", "status-bar", "high-dpi", "tray-notification", "combobox", "notice", "textbox", "frame"] }
winapi = { version = "0.3", features = ["winuser", "consoleapi", "wincon", "processenv", "commctrl", "shellapi", "fileapi", "winbase", "combaseapi", "objbase", "timezoneapi", "minwinbase", "libloaderapi", "uxtheme", "synchapi", "errhandlingapi", "sysinfoapi", "winerror", "handleapi", "processthreadsapi", "wingdi", "oleidl", "ole2", "objidl", "unknwnbase", "guiddef", "windef", "minwindef", "usp10", "winhttp", "winnt", "winreg", "dbt", "ioapiset", "shobjidl_core", "shlobj", "knownfolders", "shtypes",
    # Quick search: open windows (windows.rs) and system commands (system.rs).
    "dwmapi", "powerbase", "powrprof", "reason", "securitybaseapi"] }

# Windows.Media.Ocr for text in images and scanned PDFs (src/ocr.rs);
# ApplicationModel(_Activation): the Store version's StartupTask (src/store.rs).
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_WinRT"] }

# The new interface (src/webui/): WebView2 through wry, hosted in a Win32
# window. MSVC only: with the GNU target webview2-com links WebView2Loader.dll
# at load time, which would break the single-exe rule (and the program would
# not start without that DLL), so mingw builds keep the classic UI only.
[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
wry = { version = "0.57.1", default-features = false }
webview2-com = "0.39.1"
raw-window-handle = "0.6.2"

[build-dependencies]
embed-manifest = "1.5.1"
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# native-windows-gui 1.0.13 with a GDI handle leak fixed (vendor/README.md).
[patch.crates-io]
native-windows-gui = { path = "vendor/native-windows-gui" }
