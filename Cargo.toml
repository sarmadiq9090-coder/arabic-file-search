[package]
name = "bahth"
version = "0.4.1"
edition = "2024"
description = "بحث سريع - برنامج بحث سريع عن الملفات وداخل المستندات لويندوز"

[dependencies]
bincode = "1.3"
calamine = "0.37.0"
encoding_rs = "0.8.42"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
unicode-normalization = "0.1.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
zip = "9.1.3"
sha2 = "0.10"
cfb = "0.15.0"
regex = "1"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
lopdf = { version = "0.42", default-features = false }
flate2 = "1"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["list-view", "animation-timer", "clipboard", "menu", "file-dialog", "status-bar", "high-dpi", "tray-notification", "combobox", "notice", "textbox"] }
winapi = { version = "0.3", features = ["winuser", "consoleapi", "wincon", "processenv", "commctrl", "shellapi", "fileapi", "winbase", "combaseapi", "objbase", "timezoneapi", "minwinbase", "libloaderapi", "uxtheme", "synchapi", "errhandlingapi", "sysinfoapi", "winerror", "handleapi", "processthreadsapi", "wingdi", "oleidl", "ole2", "objidl", "unknwnbase", "guiddef", "windef", "minwindef", "usp10", "winhttp", "winnt", "winreg"] }

# Windows.Media.Ocr for text in images and scanned PDFs (src/ocr.rs).
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_WinRT"] }

[build-dependencies]
embed-manifest = "1.5.1"
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
