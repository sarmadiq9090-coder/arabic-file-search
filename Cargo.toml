[package]
name = "bahth"
version = "0.1.0"
edition = "2024"
description = "بحث سريع - برنامج بحث سريع عن الملفات وداخل المستندات لويندوز"

[dependencies]
bincode = "1.3"
calamine = "0.37.0"
encoding_rs = "0.8.42"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
zip = "9.1.3"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["list-view", "animation-timer", "clipboard", "menu", "file-dialog", "status-bar", "high-dpi"] }
winapi = { version = "0.3", features = ["winuser", "commctrl", "shellapi", "fileapi", "winbase", "combaseapi", "objbase", "timezoneapi", "minwinbase"] }

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
